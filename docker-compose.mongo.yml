# Opt-in overlay that enables the social layer's MongoDB backend.
#
# The social domain is Mongo-backed but degradable, so docker-compose.prod.yml intentionally
# ships WITHOUT Mongo (posts/feed just degrade). Layer this file on to run Mongo locally and
# point the api at it, so the social feed actually persists and renders:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.mongo.yml up -d
#
# Not for production-by-default — enable it deliberately where you want the social feature live.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Bounded so a runaway inside this container cannot trigger a *global* OOM in the
    # Docker VM. That is not hypothetical: see the healthcheck note below. mongod itself
    # idles near 160MB here, so this is roughly 4x headroom, and exceeding it now kills
    # only this container instead of taking postgres down with it.
    mem_limit: 768m
    healthcheck:
      # A TCP connect, deliberately — NOT `mongosh --eval "db.adminCommand('ping')"`.
      #
      # mongosh is a Node process (~1.3GB virtual, ~130MB resident) with a slow start. On a
      # memory-constrained host it could not finish inside the old 5s timeout, so a fresh one
      # spawned every 10s while the previous ones were still resident. That pile-up drove the
      # whole Docker VM into global OOM, and the kernel's victims included **postgres
      # backends** — a backend exiting abnormally makes the postmaster reinitialize the entire
      # cluster. 155 cluster reinits were logged before this was found; the symptom presented
      # as "login times out", several layers away from the cause.
      #
      # The honest trade: this proves the port is accepting connections, not that mongod can
      # answer a query, so a wedged-but-listening mongod would read as healthy. That is a far
      # smaller risk than a healthcheck that periodically destroys the database cluster it
      # shares a host with. If richer semantics are ever needed, add a cheap non-Node probe —
      # do not restore the mongosh ping without also raising the VM's memory.
      #
      # 2026-08-22: this helped a lot but did NOT end the cluster reinitialisations —
      # 76/day before, ~11/day after, with the fix demonstrably live. Do not read the
      # 155 figure above as "solved". A residual, undiagnosed cause remains; see
      # TECH_DEBT.md POSTGRES-CRASH-RESIDUAL-1 before concluding that a crash you are
      # looking at was caused by mongo.
      # `bash` explicitly, not CMD-SHELL: /bin/sh in mongo:7 is dash, and /dev/tcp is a bash
      # builtin, so CMD-SHELL fails with "Directory nonexistent" — which reads like a broken
      # container rather than a broken probe. bash is present in this image; nc and curl are not.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    environment:
      MONGO_URL: "mongodb://mongo:27017/aindy"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
