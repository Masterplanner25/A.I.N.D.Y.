# Production-style overlay for the APP PROFILE: this repo's server image (apps consuming the
# installed aindy-runtime) plus its datastores. Follows the runtime's own `aindy-runtime init`
# compose shape (service `api`, /health healthcheck, pgvector, redis under a "full" profile),
# but builds the app image so apps.bootstrap registers the domains via the plugin ABI.
#
# Secrets come from the environment / an .env file — do not commit real values.
#   Required: SECRET_KEY, AINDY_API_KEY, PERMISSION_SECRET
#   Model keys (as used by the domains): OPENAI_API_KEY, DEEPSEEK_API_KEY, ANTHROPIC_API_KEY
#   Optional: MONGO_URL (social layer; degradable), POSTGRES_PASSWORD
#
# Redis (distributed job queue / cross-instance events) is opt-in, mirroring the runtime:
#   set EXECUTION_MODE=distributed and run:  docker compose --profile full up -d
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # psycopg2 is the runtime's bundled driver -> plain postgresql:// scheme.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-aindy}:${POSTGRES_PASSWORD:-aindy}@postgres:5432/${POSTGRES_DB:-aindy}"
      REDIS_URL: "redis://redis:6379/0"
      MONGO_URL: "${MONGO_URL:-}"
      AINDY_HOST: "0.0.0.0"
      AINDY_PORT: "8000"
      # REQUIRED for the 16 domain apps to load. `aindy-runtime serve` setdefaults
      # AINDY_BOOT_MODE=runtime-only (platform-only profile = ZERO apps), so without
      # this the image would boot the runtime with no domains, no /apps/* routes, and
      # no agent planner. app-profile selects ./aindy_plugins.json -> apps.bootstrap.
      AINDY_BOOT_MODE: "${AINDY_BOOT_MODE:-app-profile}"
      AINDY_APP_PLUGIN_MANIFEST: "${AINDY_APP_PLUGIN_MANIFEST:-./aindy_plugins.json}"
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY}"
      AINDY_API_KEY: "${AINDY_API_KEY:?set AINDY_API_KEY}"
      PERMISSION_SECRET: "${PERMISSION_SECRET:?set PERMISSION_SECRET}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # ── Email verification + password recovery (aindy-runtime >= 2.0.0) ─────────
      # Registration now returns 202 and emails a verification link; the access token
      # comes from POST /auth/verify-email. The template MUST point at the client's
      # /verify-email route or the mail ships a bare token with nowhere to paste it.
      AINDY_EMAIL_VERIFY_URL_TEMPLATE: "${AINDY_EMAIL_VERIFY_URL_TEMPLATE:-}"
      AINDY_EMAIL_VERIFY_TTL_HOURS: "${AINDY_EMAIL_VERIFY_TTL_HOURS:-48}"
      # Leave OFF unless every account is verified — it refuses login for unverified
      # addresses and is a lockout risk. Existing accounts were backfilled to verified
      # by the 2.0.0 migration, so new signups are the only unverified ones.
      AINDY_REQUIRE_VERIFIED_LOGIN: "${AINDY_REQUIRE_VERIFIED_LOGIN:-}"
      # Password recovery. /auth/password/forgot always returns 200 (never discloses
      # whether the address exists) but 503s when no email channel is configured — the
      # UI surfaces that one plainly, since it describes the deployment, not an account.
      # The template MUST point at the client's /reset-password route, e.g.
      #   https://<host>/reset-password?token={token}
      # Left empty, the runtime mails a bare token; that page accepts a pasted token as
      # a fallback, but the link is the intended path.
      AINDY_PASSWORD_RESET_TTL_MINUTES: "${AINDY_PASSWORD_RESET_TTL_MINUTES:-30}"
      AINDY_PASSWORD_RESET_URL_TEMPLATE: "${AINDY_PASSWORD_RESET_URL_TEMPLATE:-}"
      # Delivery is hybrid: a registered `email` connector wins, else runtime SMTP.
      # HOST *and* FROM must both be set for SMTP to count as configured. With neither
      # channel available, verification mail cannot be sent and a new signup cannot
      # complete — the link never arrives.
      # A registered connector that FAILS does not fall back to SMTP: the fallback is
      # for absence, not failure, so a broken chosen route never silently reroutes mail.
      AINDY_SMTP_HOST: "${AINDY_SMTP_HOST:-}"
      AINDY_SMTP_PORT: "${AINDY_SMTP_PORT:-587}"
      AINDY_SMTP_USER: "${AINDY_SMTP_USER:-}"
      AINDY_SMTP_PASSWORD: "${AINDY_SMTP_PASSWORD:-}"
      AINDY_SMTP_FROM: "${AINDY_SMTP_FROM:-}"
      AINDY_SMTP_STARTTLS: "${AINDY_SMTP_STARTTLS:-true}"
      # Perplexity Search API — powers search/research and rippletrace mention detection.
      # Without it both degrade to "unavailable" rather than failing; nothing else needs it.
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY:-}"
      # Scheduled ripple mention detection spends a Perplexity call per drop point, so the
      # background job is opt-in. The per-drop-point and batch routes work regardless.
      AINDY_RIPPLE_MENTION_DETECTION: "${AINDY_RIPPLE_MENTION_DETECTION:-}"
      # Agent PLANNER backend (BUILD_PLAN Track 2). Default runtime_local (deterministic,
      # no egress). Flip to anthropic_chat in your .env to have Claude author real plans —
      # that path needs ANTHROPIC_API_KEY (above) + outbound HTTPS to api.anthropic.com.
      # See docs/deployment/DEPLOYMENT.md "Enabling the Claude planner".
      AINDY_AGENT_PLANNER_BACKEND: "${AINDY_AGENT_PLANNER_BACKEND:-runtime_local}"
      AINDY_CLAUDE_PLANNER_MODEL: "${AINDY_CLAUDE_PLANNER_MODEL:-}"
      # ── Shadow / advisory flags (LIVE_VERIFICATION_SCOPE phase 2c) ──────────────
      # These MUST be declared here to reach the container. Compose reads .env for
      # interpolation only — a variable set in .env but absent from this block is
      # simply not passed to the process. AINDY_INFINITY_THREE_AXIS_SHADOW and
      # AINDY_INFINITY_LEARNED_SHADOW were set in .env and never arrived, which is
      # why no shadow data was ever recorded.
      #
      # Root-cause fix for DB-NODUS-BUDGET-1, shipped default-off in 2.0.0 pending soak.
      AINDY_MEMORY_RECALL_OWN_SESSION: "${AINDY_MEMORY_RECALL_OWN_SESSION:-}"
      # SHADOW flags compute and record without changing behaviour — safe to leave on.
      AINDY_INFINITY_THREE_AXIS_SHADOW: "${AINDY_INFINITY_THREE_AXIS_SHADOW:-}"
      AINDY_INFINITY_LEARNED_SHADOW: "${AINDY_INFINITY_LEARNED_SHADOW:-}"
      # ADVISORY flags blend the new signal into live decisions — flip only after a
      # shadow window has been read. Default off.
      AINDY_INFINITY_THREE_AXIS_ADVISORY: "${AINDY_INFINITY_THREE_AXIS_ADVISORY:-}"
      AINDY_INFINITY_LEARNED_ADVISORY: "${AINDY_INFINITY_LEARNED_ADVISORY:-}"
      AINDY_INFINITY_WORTH_WEIGHT: "${AINDY_INFINITY_WORTH_WEIGHT:-}"
      AINDY_INFINITY_TRAJECTORY_WEIGHT: "${AINDY_INFINITY_TRAJECTORY_WEIGHT:-}"
      # Behaviour-changing paths — deliberately listed so they are visible and
      # overridable, but default off.
      AINDY_REASONING_NODUS_NATIVE: "${AINDY_REASONING_NODUS_NATIVE:-}"
      # NOTE: AINDY_NEXT_ACTION_ACTING is a TYPED pydantic Settings field (bool), not an
      # os.environ read like the others here. An empty string fails validation and the
      # container crash-loops at `aindy-runtime bootstrap-schema` before it ever serves.
      # It needs a parseable boolean default, never "".
      AINDY_NEXT_ACTION_ACTING: "${AINDY_NEXT_ACTION_ACTING:-false}"
      AINDY_SEARCH_EMBEDDING_RANKING: "${AINDY_SEARCH_EMBEDDING_RANKING:-}"
      AINDY_SEARCH_OUTCOME_WEIGHTING: "${AINDY_SEARCH_OUTCOME_WEIGHTING:-}"
      # WARNING: AINDY_SEARCH_OUTREACH_SEND sends REAL outreach. Never include it in a
      # soak batch. Declared for visibility; leave unset unless that is the intent.
      AINDY_SEARCH_OUTREACH_SEND: "${AINDY_SEARCH_OUTREACH_SEND:-}"
      # DB statement / idle-in-transaction reap timeouts (ms). The runtime defaults to 30000,
      # which is too tight for cold-start + agent-execution workloads on slower hosts: a
      # request that holds a transaction open across a slow external call (embeddings, an
      # agent step) gets its connection reaped mid-flight, poisoning the pool. Raised here
      # and env-overridable. See docs/deployment/DEPLOYMENT.md.
      DB_STATEMENT_TIMEOUT_MS: "${DB_STATEMENT_TIMEOUT_MS:-120000}"
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-120000}"
      # Connection-pool headroom — agent execution fans out concurrent memory/embedding
      # writes; the default 10+20 exhausts under that load on slower hosts.
      DB_POOL_SIZE: "${DB_POOL_SIZE:-20}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-40}"
      # Nodus per-execution budget. The worker cold-starts the app stack (~16 apps) per run;
      # the runtime default (30s script + 15s boot allowance) is too tight for an app-profile
      # cold-start on a slower host, so executions fail with "worker exceeded 45000ms hard
      # limit". Widened + env-overridable. See docs/deployment/DEPLOYMENT.md.
      AINDY_NODUS_MAX_EXECUTION_MS: "${AINDY_NODUS_MAX_EXECUTION_MS:-120000}"
      AINDY_NODUS_BOOT_ALLOWANCE_MS: "${AINDY_NODUS_BOOT_ALLOWANCE_MS:-60000}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-aindy}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aindy}"
      POSTGRES_DB: "${POSTGRES_DB:-aindy}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aindy} -d ${POSTGRES_DB:-aindy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: ["full"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Social layer is Mongo-backed but degradable; enable if you need it and set MONGO_URL.
  # mongo:
  #   image: mongo:7
  #   profiles: ["full"]
  #   volumes:
  #     - mongo_data:/data/db

volumes:
  postgres_data:
  # mongo_data:
