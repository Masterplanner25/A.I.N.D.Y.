[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aindy-apps-monolith"
version = "1.0.0"
description = "A.I.N.D.Y. — a persistent execution partner built around the Infinity Algorithm, running on the aindy-runtime substrate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "platform-team" }]
dependencies = [
  "aindy-runtime>=2.9.0,<3.0",
  "aindy-sdk>=1.0,<2.0",
  "anthropic>=0.40,<2.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pytest-env==1.7.0",
  "pytest-mock==3.15.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*"]
namespaces = true
