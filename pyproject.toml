[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aindy-apps-monolith"
version = "1.0.0"
description = "A.I.N.D.Y. — a persistent execution partner built around the Infinity Algorithm, running on the aindy-runtime substrate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "platform-team" }]
dependencies = [
  # [mcp]: nodus-mcp + the MCP SDK, for scripts/mcp_server.py (owner, 2026-10-14: other AIs are
  # access to the algorithm's state). The runtime owns those bounds; the extra inherits them.
  # [security] (2.29.0): setuptools>=84.1.0. Without it the image keeps the base image's
  # setuptools (79.0.1 on 2.28.2), whatever the runtime's fix says.
  "aindy-runtime[mcp,security]>=2.35.0,<3.0",
  "aindy-sdk>=1.2.1,<2.0",
  "anthropic>=0.40,<3.0",
  # apps/search/services/seo_services.py imports both. Declared here since the 2.21.0 adoption
  # (PACK-DEBT-6, the handoff's ask 4): they had arrived only because the runtime pinned them,
  # and nothing in the runtime uses them — the runtime drops its pins two releases on. Floors
  # are the versions it pinned; ranged, not pinned, for the same reason as aindy-sdk and
  # anthropic (constraints.txt is not a lockfile).
  "nltk>=3.10.3,<4.0",
  "textstat>=0.7.13,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-cov==7.1.0",
  "pytest-env==1.7.1",
  "pytest-mock==3.17.0",
  "pyyaml==6.0.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*"]
namespaces = true

# The Nodus workflows. `include-package-data` alone ships nothing without a MANIFEST.in, so until
# 2026-11-02 the image's installed `apps` had no `nodus/` folders: a scheduled job's callback
# imports that copy, registered nothing and fell back to Python on every run.
[tool.setuptools.package-data]
"*" = ["*.nd"]
