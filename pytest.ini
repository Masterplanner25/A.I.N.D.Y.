[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts = -q --disable-warnings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: full integration suite — requires live Postgres, Redis, Mongo (see pytest.integration.ini)
    app_profile: requires app-owned bootstrap, routes, or models under apps/
    postgres: exercises behavior that differs between SQLite and PostgreSQL (FK cascades, JSONB, UUID)
    redis: requires a live Redis instance — set REDIS_URL before running
    multi_instance: requires fakeredis for cross-instance simulation
env =
    TEST_MODE=true
    ENFORCE_EXECUTION_CONTRACT=true
    AINDY_ASYNC_HEAVY_EXECUTION=false
    DATABASE_URL=sqlite:///:memory:
    AINDY_ALLOW_SQLITE=true
    AINDY_SKIP_MONGO_PING=true
    SKIP_MONGO_PING=true
    MONGO_URL=
    OPENAI_API_KEY=sk-test-key-for-pytest-only
    # Nodus per-execution budget. The worker cold-starts the app stack (~16 apps) per run,
    # and the runtime default (30s script + 15s boot) is too tight for that under full-suite
    # load — `test_real_vm_run_routes_through_nodus` then fails with "worker exceeded
    # 45000ms hard limit" while passing when run alone, which reads as a mystery flake.
    # docker-compose.prod.yml already widens these for the same reason; the test
    # environment simply never got the same treatment.
    AINDY_NODUS_MAX_EXECUTION_MS=120000
    AINDY_NODUS_BOOT_ALLOWANCE_MS=60000
